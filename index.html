<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Headers (Meta-tag equivalents) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https: http://localhost:8001; object-src 'self'; base-uri 'self';"
    />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <!-- SEO & Identity Metadata -->
    <meta name="google-site-verification" content="googlec100576fc9774f5a" />
    <title>Atif Moin | Frontend Engineer</title>
    <meta
      name="description"
      content="Atif Moin is a frontend engineer in Noida, India. React and TypeScript up front, FastAPI and AI agents behind it. Case studies, open-source packages and how he works."
    />
    <meta name="author" content="Atif Moin" />
    <meta name="theme-color" content="#f1f1ec" />
    <link rel="canonical" href="https://portfolio.fullstackcity.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atif Moin" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://portfolio.fullstackcity.in/" />
    <meta property="og:title" content="Atif Moin | Frontend Engineer" />
    <meta
      property="og:description"
      content="Frontend engineer. I make complicated products feel simple. React, TypeScript, FastAPI and AI agents."
    />
    <meta property="og:image" content="https://portfolio.fullstackcity.in/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Atif Moin, frontend engineer: I make complicated products feel simple." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atif Moin | Frontend Engineer" />
    <meta
      name="twitter:description"
      content="Frontend engineer. I make complicated products feel simple. React, TypeScript, FastAPI and AI agents."
    />
    <meta name="twitter:image" content="https://portfolio.fullstackcity.in/og-image.png" />
    <meta name="twitter:image:alt" content="Atif Moin, frontend engineer: I make complicated products feel simple." />

    <!-- Structured data for crawlers that do not run JS; StructuredData.tsx adds the
         full version (same @id) from the live content. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://portfolio.fullstackcity.in/#person",
        "name": "Atif Moin",
        "jobTitle": "Senior Software Engineer",
        "url": "https://portfolio.fullstackcity.in/",
        "image": "https://portfolio.fullstackcity.in/og-image.png",
        "address": { "@type": "PostalAddress", "addressLocality": "Noida", "addressCountry": "IN" },
        "sameAs": [
          "https://github.com/Atifmoin19",
          "https://www.linkedin.com/in/atif-moin-858167179/"
        ],
        "knowsAbout": ["React", "TypeScript", "Next.js", "FastAPI", "PostgreSQL", "AI agents"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
